<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Saurus/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.homeTitle">Arhitektonski studio Saurus - Za unapređenje prostora za život običnih ljudi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Pontano+Sans:wght@300..700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/Saurus/assets/projekat-CLJzBKvq.js"></script>
    <link rel="modulepreload" crossorigin href="/Saurus/assets/nav-DK3e8-bK.js">
    <link rel="modulepreload" crossorigin href="/Saurus/assets/loadProjects-DPfJmwcN.js">
    <link rel="stylesheet" crossorigin href="/Saurus/assets/nav-DZhz4pRq.css">
  </head>

  <body>
    <header class="navbar" style="box-shadow: none;">
      <a href="../" id="logo-container">
        <img
          src="/Saurus/studio-saurus-logo.png" 
          alt="Studio Saurus logo" 
          srcset="" 
          class="logo"
          data-i18n="images.logo"
          data-i18n-attr="images.logo"
          data-i18n-attribute="alt"
          />
      </a>
      <button class="mobile-nav-toggle" aria-controls="nav-menu" aria-expanded="false">
        <iconify-icon icon="ri:menu-line" id="menu-icon"></iconify-icon>
        <span class="sr-only">Menu</span>
      </button>
      <nav>
        <ul id="nav-menu" data-visible="false">
          <li><button type="button" id="language-toggle">EN</button></li>
          <li><a href="../vesti/" data-i18n="navigation.news">Vesti</a></li>
          <li><a href="../projekti/" data-i18n="navigation.projects">Projekti</a></li>
          <li><a href="../studio/" data-i18n="navigation.studio">Studio</a></li>
        </ul>
      </nav>
    </header>
    <main id="project-container">
      <div id="project-carousel">
      </div>
      <div id="project-info">
        <h1 id="project-title">Project Name</h1>
        <table>
          <tbody>
            <tr>
              <th>Period Posla</th>
              <td data-field="period">Period</td>
            </tr>
            <tr>
              <th>Klijent</th>
              <td data-field="client">Client</td>
            </tr>
            <tr>
              <th>Lokacija</th>
              <td data-field="location">Location</td>
            </tr>
            <tr>
              <th>Opis</th>
              <td data-field="description">Description</td>
            </tr>
            <tr>
              <th>Bruto</th>
              <td data-field="gross">Gross</td>
            </tr>
            <tr>
              <th>Status</th>
              <td data-field="status">Status</td>
            </tr>
          </tbody>
        </table>
        <div id="project-description">Longer description</div>
      </div>
    </main>
    <footer class="link-container">
      <a href="https://www.facebook.com/StudioSaurus/" aria-label="Facebook"><iconify-icon icon="ri:facebook-fill" class="link-icon"></iconify-icon></a>
      <a href="https://www.instagram.com/studio_saurus/" aria-label="Instagram"><iconify-icon icon="ri:instagram-line" class="link-icon"></iconify-icon></a>
      <a href="https://www.linkedin.com/company/studio-saurus/" aria-label="LinkedIn"><iconify-icon icon="ri:linkedin-fill" class="link-icon"></iconify-icon></a>
    </footer>


    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  </body>
</html>
