<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.404">404: "Page not found - Arhitektonski studio SAURUS"</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Pontano+Sans:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <header class="navbar" style="background-color: transparent;">
      <a href="%BASE_URL%" id="logo-container">
        <img
          src="/studio-saurus-logo.png"
          alt="Studio Saurus logo"
          class="logo"
          data-i18n="images.logo"
          data-i18n-attr="images.logo"
          data-i18n-attribute="alt"
        />
      </a>

      <button class="mobile-nav-toggle" aria-controls="nav-menu" aria-expanded="false">
        <iconify-icon icon="ri:menu-line" id="menu-icon"></iconify-icon>
        <span class="sr-only" data-i18n="navigation.menu">Meni</span>
      </button>

      <nav>
        <ul id="nav-menu" data-visible="false">
          <li><button type="button" id="language-toggle">en</button></li>
          <li><a href="%BASE_URL%vesti/" data-i18n="navigation.news">vesti</a></li>
          <li><a href="%BASE_URL%projekti/" data-i18n="navigation.projects">projekti</a></li>
          <li><a href="%BASE_URL%studio/" data-i18n="navigation.studio">studio</a></li>
        </ul>
      </nav>
    </header>

    <section id="missing-container">
      <p data-i18n="404.text">Oops! That page can't be found.</p>
      <span>404</span>
    </section>
    <script type="module" src="/src/i18n.js"></script>
    <script type="module" src="/src/nav.js"></script>
    <script type="module">
        document.querySelector('#home-link').href =
          import.meta.env.BASE_URL
      </script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  </body>
</html>
