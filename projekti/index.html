  </head>
  <body>
    <header class="navbar" style="box-shadow: none;">
      <a href="../" id="logo-container">
        <img
          src="/Saurus/studio-saurus-logo.png" 
          alt="Studio Saurus logo" 
          srcset="" 
          class="logo"
          data-i18n="images.logo"
          data-i18n-attr="images.logo"
          data-i18n-attribute="alt"
          />
      </a>
      <button class="mobile-nav-toggle" aria-controls="nav-menu" aria-expanded="false">
        <iconify-icon icon="ri:menu-line" id="menu-icon"></iconify-icon>
        <span class="sr-only">Menu</span>
      </button>
      <nav>
        <ul id="nav-menu" data-visible="false">
          <li><a href="#" data-i18n="navigation.news">Vesti</a></li>
          <li><a href="../projekti/" data-i18n="navigation.projects">Projekti</a></li>
          <li><a href="../studio/" data-i18n="navigation.studio">Studio</a></li>
          <li><button type="button" id="language-toggle">EN</button></li>
        </ul>
      </nav>
    </header>
    <h1 style="display: none;" data-i18n="projectsPage.title">Projekti</h1>
    <!-- parent div bicause of position sticky on filter -->
    <div> 
      <div id="filter-container">
        <h2 style="display: none;" data-i18n="projectsPage.filtersTitle">Filteri</h2>
        <div class="filter-subcontainer" id="type-filter">
          <button type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n="projectsPage.type">
            Tip
            <iconify-icon icon="ri:arrow-down-s-line"></iconify-icon>
            <iconify-icon icon="ri:arrow-up-s-line"></iconify-icon>
          </button> 
          <ul role="listbox" aria-multiselectable="true"  class="filter-group">
            <li><button type="button" aria-pressed="true" class="active" data-i18n="projectsPage.all">
              <iconify-icon icon="ri:checkbox-fill"></iconify-icon>Sve
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.types.commercial">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Poslovni
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.types.urbanism">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Urbanizam
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.types.residential">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Stambeni
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.types.house">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Kuća
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.types.public">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Javni
            </button></li>
          </ul>
        </div>
        <div class="filter-subcontainer" id="phase-filter">
          <button type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n="projectsPage.phase">
            Faza
            <iconify-icon icon="ri:arrow-down-s-line"></iconify-icon>
            <iconify-icon icon="ri:arrow-up-s-line"></iconify-icon>
          </button>
          <ul role="listbox" aria-multiselectable="true" class="filter-group">
            <li><button type="button" aria-pressed="true" class="active" data-i18n="projectsPage.all">
              <iconify-icon icon="ri:checkbox-fill"></iconify-icon>Sve
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.phases.conceptual">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Idejni
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.phases.main">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Glavni
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.phases.interior">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Enterijer
            </button></li>
          </ul>
        </div>
        <div class="filter-subcontainer" id="status-filter">
          <button type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n="projectsPage.status">
            Status
            <iconify-icon icon="ri:arrow-down-s-line"></iconify-icon>
            <iconify-icon icon="ri:arrow-up-s-line"></iconify-icon>
          </button>
          <ul role="listbox" aria-multiselectable="true" class="filter-group">
            <li><button type="button" aria-pressed="true" class="active" data-i18n="projectsPage.all">
              <iconify-icon icon="ri:checkbox-fill"></iconify-icon>Sve
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.statuses.competition">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Konkurs
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.statuses.awarded">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Nagrađen
            </button></li>
            <li><button type="button" aria-pressed="false" data-i18n="projectsPage.statuses.built">
              <iconify-icon icon="ri:checkbox-blank-line"></iconify-icon>Izveden
            </button></li>
          </ul>
        </div>
        <div id="year-filter">
          <button type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n="projectsPage.year">
            Godina
            <iconify-icon icon="ri:arrow-down-s-line"></iconify-icon>
            <iconify-icon icon="ri:arrow-up-s-line"></iconify-icon>
          </button>
          <ul role="listbox" aria-multiselectable="true">
            <li><button type="button" role="option" aria-selected="true" class="active" data-i18n="projectsPage.all">
              <iconify-icon icon="ri:checkbox-fill"></iconify-icon>Sve
            </button></li>
          </ul>
        </div>
      </div>
      <div id="project-container">
        <div id="projects">
        </div>
      </div>
    </div>

    <footer>
      <div class="link-container">

        <a href="https://www.instagram.com/studio_saurus/"><iconify-icon icon="ri:instagram-line" class="link-icon"></iconify-icon></a>
      </div>
    </footer>
